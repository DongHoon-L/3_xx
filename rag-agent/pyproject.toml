[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-agent"
version = "0.1.0"
description = "Audited RAG agent: Bearer auth, prompt-injection guards, local TF-IDF retrieval, OpenAI-compatible LLM"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "requests>=2.31",
  "python-dotenv>=1.0",
  "audit-engine>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["rag_agent*"]

[tool.setuptools.package-data]
rag_agent = ["data/*.json"]
